<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0E0E12"/>
  <!-- Cut-gem glyph, matching the in-app rating icon (GemRating.tsx) so the
       favicon reads as the same brand mark, not a separate logo. -->
  <g transform="translate(50 51) scale(3.1) translate(-12 -12)">
    <polygon points="12,2 19,8 22,10 17,22 7,22 2,10 5,8" fill="#12A66B" stroke="#0B6E4C" stroke-width="0.5" stroke-linejoin="round"/>
    <polygon points="12,2 19,8 12,10 5,8" fill="#3DD89B"/>
    <polygon points="5,8 12,10 7,22" fill="#0F8C5A"/>
    <polygon points="19,8 22,10 17,22 12,10" fill="#0B6E4C"/>
  </g>
</svg>
