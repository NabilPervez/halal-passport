[build]
  command   = "npm run build"
  publish   = "dist"

# Favicon alias — redirect legacy /favicon.ico to the SVG icon
[[redirects]]
  from   = "/favicon.ico"
  to     = "/icon.svg"
  status = 301

# SPA fallback - all routes are served index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), camera=(), microphone=()"

# Immutable cache for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for PWA manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Digital Asset Links — proves this site and the Android TWA share an owner,
# which is what stops the TWA showing a browser URL bar. Android fetches it
# as application/json; it must NOT be caught by the SPA catch-all below
# (Netlify serves real files before applying redirects, so it isn't).
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type  = "application/json"
    Cache-Control = "public, max-age=3600"

# No cache for service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
